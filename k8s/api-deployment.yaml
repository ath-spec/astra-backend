apiVersion: apps/v1
kind: Deployment
metadata:
  name: astra-backend
  labels:
    app: astra-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: astra-backend
  template:
    metadata:
      labels:
        app: astra-backend
    spec:
      containers:
        - name: astra-backend
          image: 070443470895.dkr.ecr.ap-south-1.amazonaws.com/abhimanyu-gupta-ecr:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: astra-api-config
            - secretRef:
                name: astra-api-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health # Assuming this is the health route. Adjust if needed.
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
