apiVersion: apps/v1
kind: Deployment
metadata:
  name: astra-postgres
  labels:
    app: astra-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: astra-postgres
  template:
    metadata:
      labels:
        app: astra-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "AstraSecret123!"
            - name: POSTGRES_DB
              value: "astra"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          emptyDir: {} # Ephemeral storage. Data is lost if pod is deleted.

---
apiVersion: v1
kind: Service
metadata:
  name: astra-postgres
  labels:
    app: astra-postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: astra-postgres
